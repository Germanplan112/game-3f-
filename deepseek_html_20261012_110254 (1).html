<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚽ Футбол по Wi-Fi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a2a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Comic Sans MS', sans-serif;
    color: white;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #game {
    position: relative;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 800px;
    background: #2d8a2d;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
    touch-action: none;
  }

  #field {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg,
      #2d8a2d 0 40px,
      #33993a 40px 80px);
  }

  .line {
    position: absolute;
    background: white;
    opacity: 0.9;
    pointer-events: none;
  }

  #center-line {
    left: 50%; top: 0; bottom: 0;
    width: 3px;
    transform: translateX(-50%);
  }

  #center-circle {
    position: absolute;
    left: 50%; top: 50%;
    width: 90px; height: 90px;
    border: 3px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.9;
    pointer-events: none;
  }

  .goal {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 120px;
    background: white;
    opacity: 0.9;
    border-radius: 3px;
  }
  #goal-left { left: 0; }
  #goal-right { right: 0; }

  .my-goal {
    box-shadow: 0 0 25px 6px #ffd93d;
    animation: pulseGoal 1.5s infinite;
  }
  @keyframes pulseGoal {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 1; box-shadow: 0 0 35px 10px #ffd93d; }
  }

  /* Счёт */
  #scoreboard {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.8);
    padding: 8px 18px;
    border-radius: 20px;
    font-size: 20px;
    font-weight: bold;
    z-index: 20;
    border: 2px solid white;
    display: flex;
    gap: 15px;
    align-items: center;
    white-space: nowrap;
  }
  .blue { color: #4a9eff; }
  .red  { color: #ff6b6b; }

  /* Игроки */
  .player {
    position: absolute;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    z-index: 10;
    border: 3px solid white;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  #p1 { background: radial-gradient(circle at 30% 30%, #6bb3ff, #1a5fb4); }
  #p2 { background: radial-gradient(circle at 30% 30%, #ff8a8a, #b41a1a); }

  #ball {
    position: absolute;
    width: 26px; height: 26px;
    font-size: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9;
    filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.5));
    pointer-events: none;
  }

  #goal-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, rgba(255,217,61,0.7), transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 30;
  }
  #goal-flash.show { opacity: 1; }

  #goal-text {
    position: absolute;
    top: 35%;
    left: 0; right: 0;
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    color: #ffd93d;
    text-shadow: 0 0 20px black, 0 0 40px #ffd93d;
    opacity: 0;
    transition: all 0.3s;
    z-index: 40;
    pointer-events: none;
    transform: scale(0.5);
  }
  #goal-text.show { opacity: 1; transform: scale(1); }

  /* КНОПКИ СЛЕВА */
  #controls {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 15;
  }

  .btn {
    width: 62px;
    height: 62px;
    font-size: 30px;
    font-weight: bold;
    font-family: inherit;
    border: 3px solid white;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    transition: all 0.05s;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
  }

  .btn:active, .btn.pressed {
    transform: translateY(4px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.4);
    filter: brightness(1.5);
  }

  .btn-blue { background: linear-gradient(180deg, #4a9eff, #1a5fb4); }
  .btn-red  { background: linear-gradient(180deg, #ff6b6b, #b41a1a); }

  /* КАМЕРА СЛЕВА */
  #cam-preview {
    position: absolute;
    top: 50px;
    left: 10px;
    width: 80px;
    height: 100px;
    border: 3px solid #ffd93d;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    z-index: 25;
    box-shadow: 0 0 15px rgba(255,217,61,0.6);
  }

  #cam-preview video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  #cam-label {
    position: absolute;
    bottom: -22px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: #ffd93d;
    font-weight: bold;
  }

  /* Индикатор "ты" */
  #you {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.75);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 26;
    border: 2px solid white;
    font-weight: bold;
  }

  /* Оверлей */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 20, 0, 0.94);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 25px;
    text-align: center;
  }

  #overlay h1 {
    font-size: 26px;
    color: #ffd93d;
    margin-bottom: 18px;
    text-shadow: 0 0 15px rgba(255,217,61,0.8);
  }

  #overlay p {
    font-size: 15px;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  #overlay input {
    width: 100%;
    max-width: 260px;
    padding: 14px;
    font-size: 24px;
    text-align: center;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: rgba(255,255,255,0.12);
    border: 3px solid #4a9eff;
    border-radius: 12px;
    color: white;
    outline: none;
    margin: 8px 0;
  }

  #overlay input:focus {
    border-color: #ffd93d;
    box-shadow: 0 0 15px rgba(255,217,61,0.6);
  }

  #overlay button {
    margin: 8px 0;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    font-family: inherit;
    background: linear-gradient(135deg, #4ade80, #22c55e);
    color: white;
    border: 3px solid white;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.4);
    min-width: 240px;
  }

  #overlay button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  #overlay .code-box {
    background: #ffd93d;
    color: #1a3d1a;
    font-size: 42px;
    font-weight: bold;
    padding: 15px 30px;
    border-radius: 15px;
    margin: 15px 0;
    letter-spacing: 8px;
    font-family: monospace;
    box-shadow: 0 0 25px rgba(255,217,61,0.8);
    cursor: pointer;
  }

  #overlay .status {
    font-size: 15px;
    color: #4ade80;
    margin-top: 15px;
    min-height: 20px;
  }

  #overlay .error { color: #ff6b6b; }

  #overlay .divider {
    width: 100%;
    max-width: 260px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #888;
    margin: 15px 0;
    font-size: 14px;
  }
  #overlay .divider::before,
  #overlay .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #555;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="game">
  <div id="field"></div>
  <div class="line" id="center-line"></div>
  <div id="center-circle"></div>
  <div class="goal" id="goal-left"></div>
  <div class="goal" id="goal-right"></div>

  <div id="you" class="hidden">ТЫ: <span id="you-color">—</span></div>

  <div id="cam-preview" class="hidden">
    <video id="cam" autoplay muted playsinline></video>
    <div id="cam-label">ТЫ 📹</div>
  </div>

  <div id="scoreboard">
    <span class="blue">🔵 <b id="s1">0</b></span>
    <span style="color:#ffd93d;">:</span>
    <span class="red"><b id="s2">0</b> 🔴</span>
  </div>

  <div class="player" id="p1">😎</div>
  <div class="player" id="p2">😡</div>
  <div id="ball">⚽</div>

  <div id="goal-flash"></div>
  <div id="goal-text">ГОООЛ!</div>

  <div id="controls" class="hidden">
    <button class="btn" id="btn-up">⬆</button>
    <button class="btn" id="btn-left">⬅</button>
    <button class="btn" id="btn-down">⬇</button>
    <button class="btn" id="btn-right">➡</button>
  </div>

  <div id="overlay">
    <h1>⚽ ФУТБОЛ по Wi-Fi</h1>
    <p>Игра на двоих. Один создаёт комнату,<br>второй вводит код.</p>

    <button id="create-btn">🏠 Создать комнату</button>

    <div class="divider">или</div>

    <input type="text" id="code-input" placeholder="КОД" maxlength="6" inputmode="text">
    <button id="join-btn">🔗 Подключиться</button>

    <div class="status" id="status"></div>
  </div>
</div>

<!-- PeerJS с публичного сервера -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
  // ============ DOM ============
  const game = document.getElementById('game');
  const p1 = document.getElementById('p1');
  const p2 = document.getElementById('p2');
  const ballEl = document.getElementById('ball');
  const s1El = document.getElementById('s1');
  const s2El = document.getElementById('s2');
  const overlay = document.getElementById('overlay');
  const goalFlash = document.getElementById('goal-flash');
  const goalText = document.getElementById('goal-text');
  const controls = document.getElementById('controls');
  const youBadge = document.getElementById('you');
  const youColor = document.getElementById('you-color');
  const camPreview = document.getElementById('cam-preview');
  const camVideo = document.getElementById('cam');
  const goalLeft = document.getElementById('goal-left');
  const goalRight = document.getElementById('goal-right');
  const statusEl = document.getElementById('status');

  // ============ Состояние ============
  let W, H;
  let peer = null;
  let conn = null;
  let myRole = null; // 'host' или 'guest'
  let myPeerId = null;

  const player1 = { x: 0, y: 0, vx: 0, vy: 0, speed: 3.2, size: 44 };
  const player2 = { x: 0, y: 0, vx: 0, vy: 0, speed: 3.2, size: 44 };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, size: 26, friction: 0.985 };

  let score1 = 0, score2 = 0;
  let running = false;
  let pressed = {};
  const WIN_SCORE = 3;
  let lastTime = 0;

  // ============ Размеры ============
  function resize() {
    W = game.clientWidth;
    H = game.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ============ Клавиатура ============
  document.addEventListener('keydown', (e) => {
    pressed[e.key] = true;
    pressed[e.key.toLowerCase()] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
      e.preventDefault();
    }
  });
  document.addEventListener('keyup', (e) => {
    pressed[e.key] = false;
    pressed[e.key.toLowerCase()] = false;
  });

  // ============ Кнопки слева ============
  function bindBtn(id, key) {
    const btn = document.getElementById(id);
    const press = (e) => {
      e.preventDefault();
      pressed[key] = true;
      btn.classList.add('pressed');
    };
    const release = (e) => {
      e.preventDefault();
      pressed[key] = false;
      btn.classList.remove('pressed');
    };
    btn.addEventListener('mousedown', press);
    btn.addEventListener('mouseup', release);
    btn.addEventListener('mouseleave', release);
    btn.addEventListener('touchstart', press, { passive: false });
    btn.addEventListener('touchend', release);
    btn.addEventListener('touchcancel', release);
  }

  bindBtn('btn-up', 'w');
  bindBtn('btn-left', 'a');
  bindBtn('btn-down', 's');
  bindBtn('btn-right', 'd');

  // ============ Камера ============
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: 320, height: 400 },
        audio: false
      });
      camVideo.srcObject = stream;
      camPreview.classList.remove('hidden');
    } catch (err) {
      console.log('Камера недоступна:', err.message);
    }
  }

  // ============ Генерация кода комнаты ============
  function generateCode() {
    const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = 'FB-';
    for (let i = 0; i < 4; i++) {
      code += letters[Math.floor(Math.random() * letters.length)];
    }
    return code;
  }

  // ============ PeerJS ============
  function initPeer(customId = null) {
    const id = customId || ('fb-' + Math.random().toString(36).substring(2, 10));
    peer = new Peer(id, {
      debug: 1,
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });

    peer.on('open', (id) => {
      myPeerId = id;
      console.log('Peer открыт с ID:', id);
    });

    peer.on('error', (err) => {
      console.error('Peer error:', err);
      if (err.type === 'unavailable-id') {
        statusEl.textContent = 'Код занят, попробуй ещё раз';
        statusEl.className = 'status error';
      } else if (err.type === 'peer-unavailable') {
        statusEl.textContent = 'Комната не найдена';
        statusEl.className = 'status error';
      } else {
        statusEl.textContent = 'Ошибка: ' + err.type;
        statusEl.className = 'status error';
      }
    });

    peer.on('connection', (connection) => {
      // Кто-то подключается к нам (мы хост)
      conn = connection;
      setupConnection();
    });

    return peer;
  }

  // ============ Создание комнаты ============
  document.getElementById('create-btn').onclick = () => {
    statusEl.textContent = 'Создаём комнату...';
    statusEl.className = 'status';

    const code = generateCode();
    myRole = 'host';
    initPeer(code);

    // Ждём открытия peer'а, потом показываем код
    const waitOpen = setInterval(() => {
      if (myPeerId) {
        clearInterval(waitOpen);
        showWaitingRoom(code);
      }
    }, 100);
  };

  // ============ Подключение к комнате ============
  document.getElementById('join-btn').onclick = () => {
    let code = document.getElementById('code-input').value.trim().toUpperCase();
    if (code.length < 4) {
      statusEl.textContent = 'Введи код комнаты';
      statusEl.className = 'status error';
      return;
    }
    // Добавляем префикс если не указан
    if (!code.startsWith('FB-')) {
      code = 'FB-' + code.replace('FB-', '');
    }

    statusEl.textContent = 'Подключаемся...';
    statusEl.className = 'status';

    myRole = 'guest';
    initPeer();
    myPeerId = null; // сброс

    // Ждём открытия, потом подключаемся
    const waitOpen = setInterval(() => {
      if (peer && peer.open) {
        clearInterval(waitOpen);
        conn = peer.connect(code, { reliable: true });
        setupConnection();
      }
    }, 100);
  };

  // ============ Настройка соединения ============
  function setupConnection() {
    conn.on('open', () => {
      console.log('Соединение установлено!');
      startMatch();
    });

    conn.on('data', (data) => {
      handleData(data);
    });

    conn.on('close', () => {
      running = false;
      goalText.textContent = '⚠️ Соперник вышел';
      goalText.classList.add('show');
      setTimeout(() => location.reload(), 2500);
    });

    conn.on('error', (err) => {
      console.error('Connection error:', err);
    });
  }

  function showWaitingRoom(code) {
    overlay.innerHTML = `
      <h1>🏠 Комната создана!</h1>
      <p>Скажи другу этот код:</p>
      <div class="code-box" onclick="copyCode('${code}')" title="Нажми чтобы скопировать">${code}</div>
      <p style="font-size: 12px; opacity: 0.7;">👆 нажми на код, чтобы скопировать</p>
      <p style="font-size: 13px; opacity: 0.8;">Ждём второго игрока...</p>
      <div class="status" id="wait-status">⏳ Ожидание...</div>
    `;
  }

  function copyCode(code) {
    navigator.clipboard?.writeText(code);
    const el = document.querySelector('.code-box');
    el.textContent = '✓ Скопировано!';
    setTimeout(() => { el.textContent = code; }, 1000);
  }

  // ============ Начало матча ============
  async function startMatch() {
    overlay.classList.add('hidden');
    controls.classList.remove('hidden');
    youBadge.classList.remove('hidden');

    if (myRole === 'host') {
      youColor.textContent = '🔵 СИНИЕ';
      youColor.style.color = '#4a9eff';
      document.querySelectorAll('.btn').forEach(b => b.classList.add('btn-blue'));
      goalLeft.classList.add('my-goal');
    } else {
      youColor.textContent = '🔴 КРАСНЫЕ';
      youColor.style.color = '#ff6b6b';
      document.querySelectorAll('.btn').forEach(b => b.classList.add('btn-red'));
      goalRight.classList.add('my-goal');
    }

    await startCamera();

    resize();
    resetPositions();

    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function resetPositions() {
    player1.x = W * 0.25;
    player1.y = H * 0.5;
    player2.x = W * 0.75;
    player2.y = H * 0.5;
    ball.x = W / 2;
    ball.y = H / 2;
    ball.vx = 0;
    ball.vy = 0;
  }

  // ============ Главный цикл ============
  function loop(now) {
    if (!running) return;
    const dt = Math.min(2, (now - lastTime) / 16.67);
    lastTime = now;

    if (myRole === 'host') {
      updateMyPlayer(player1, dt);
      updateBallPhysics(dt);
      draw();
      sendState();
    } else {
      updateMyPlayer(player2, dt);
      updateBallPhysics(dt);
      draw();
      sendState();
    }

    requestAnimationFrame(loop);
  }

  function updateMyPlayer(player, dt) {
    let ax = 0, ay = 0;
    if (pressed['w'] || pressed['W'] || pressed['ц'] || pressed['Ц']) ay -= 1;
    if (pressed['s'] || pressed['S'] || pressed['ы'] || pressed['Ы']) ay += 1;
    if (pressed['a'] || pressed['A'] || pressed['ф'] || pressed['Ф']) ax -= 1;
    if (pressed['d'] || pressed['D'] || pressed['в'] || pressed['В']) ax += 1;

    player.vx = ax * player.speed * dt;
    player.vy = ay * player.speed * dt;
    player.x += player.vx;
    player.y += player.vy;

    const r = player.size / 2;
    player.x = Math.max(r, Math.min(W - r, player.x));
    player.y = Math.max(r + 30, Math.min(H - r - 30, player.y));
  }

  // Физику мяча считает хост
  function updateBallPhysics(dt) {
    if (myRole !== 'host') return;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.vx *= Math.pow(ball.friction, dt);
    ball.vy *= Math.pow(ball.friction, dt);
    if (Math.abs(ball.vx) < 0.05) ball.vx = 0;
    if (Math.abs(ball.vy) < 0.05) ball.vy = 0;

    const r = ball.size / 2;

    if (ball.y - r < 30) { ball.y = 30 + r; ball.vy = -ball.vy * 0.7; }
    if (ball.y + r > H - 30) { ball.y = H - 30 - r; ball.vy = -ball.vy * 0.7; }

    const goalTop = H / 2 - 60;
    const goalBottom = H / 2 + 60;

    if (ball.x - r < 14 && ball.y > goalTop && ball.y < goalBottom) {
      score2++;
      s2El.textContent = score2;
      sendData({ type: 'goal', side: 'left', s1: score1, s2: score2 });
      showGoalText('🔴 КРАСНЫЕ ЗАБИЛИ!');
      return;
    }
    if (ball.x + r > W - 14 && ball.y > goalTop && ball.y < goalBottom) {
      score1++;
      s1El.textContent = score1;
      sendData({ type: 'goal', side: 'right', s1: score1, s2: score2 });
      showGoalText('🔵 СИНИЕ ЗАБИЛИ!');
      return;
    }

    if (ball.x - r < 0) { ball.x = r; ball.vx = -ball.vx * 0.7; }
    if (ball.x + r > W) { ball.x = W - r; ball.vx = -ball.vx * 0.7; }

    checkCollision(player1);
    checkCollision(player2);
  }

  function checkCollision(player) {
    const dx = ball.x - player.x;
    const dy = ball.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const minDist = (ball.size + player.size) / 2 + 2;

    if (dist < minDist && dist > 0) {
      const nx = dx / dist;
      const ny = dy / dist;
      ball.x = player.x + nx * minDist;
      ball.y = player.y + ny * minDist;
      const power = 7;
      ball.vx = nx * power + player.vx * 0.5;
      ball.vy = ny * power + player.vy * 0.5;
    }
  }

  // ============ Передача данных ============
  function sendData(data) {
    if (conn && conn.open) {
      conn.send(data);
    }
  }

  function sendState() {
    const data = {
      type: 'state',
      bx: ball.x, by: ball.y, bvx: ball.vx, bvy: ball.vy,
      s1: score1, s2: score2
    };
    if (myRole === 'host') {
      data.p1x = player1.x; data.p1y = player1.y;
    } else {
      data.p2x = player2.x; data.p2y = player2.y;
    }
    sendData(data);
  }

  function handleData(data) {
    if (data.type === 'state') {
      if (myRole === 'host') {
        player2.x = data.p2x;
        player2.y = data.p2y;
      } else {
        player1.x = data.p1x;
        player1.y = data.p1y;
      }
      ball.x = data.bx;
      ball.y = data.by;
      ball.vx = data.bvx;
      ball.vy = data.bvy;
      score1 = data.s1;
      score2 = data.s2;
      s1El.textContent = score1;
      s2El.textContent = score2;
    } else if (data.type === 'goal') {
      score1 = data.s1;
      score2 = data.s2;
      s1El.textContent = score1;
      s2El.textContent = score2;
      if (data.side === 'left') {
        showGoalText('🔴 КРАСНЫЕ ЗАБИЛИ!');
      } else {
        showGoalText('🔵 СИНИЕ ЗАБИЛИ!');
      }
    }
  }

  // ============ Гол ============
  function showGoalText(text) {
    goalText.textContent = text;
    goalText.classList.add('show');
    goalFlash.classList.add('show');

    setTimeout(() => {
      goalText.classList.remove('show');
      goalFlash.classList.remove('show');

      if (score1 >= WIN_SCORE || score2 >= WIN_SCORE) {
        endMatch();
      } else if (myRole === 'host') {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = 0;
        ball.vy = 0;
      }
    }, 1500);
  }

  function endMatch() {
    running = false;
    const winner = score1 >= WIN_SCORE ? '🔵 СИНИЕ' : '🔴 КРАСНЫЕ';
    const iWon = (myRole === 'host' && score1 >= WIN_SCORE) ||
                 (myRole === 'guest' && score2 >= WIN_SCORE);

    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <h1>${iWon ? '🏆 ТЫ ПОБЕДИЛ!' : '😢 ТЫ ПРОИГРАЛ'}</h1>
      <p style="font-size: 22px;">${winner} победили</p>
      <p style="font-size: 20px;">Счёт: ${score1} : ${score2}</p>
      <button onclick="location.reload()">🔄 Играть снова</button>
    `;
  }

  // ============ Отрисовка ============
  function draw() {
    p1.style.left = (player1.x - player1.size/2) + 'px';
    p1.style.top = (player1.y - player1.size/2) + 'px';
    p2.style.left = (player2.x - player2.size/2) + 'px';
    p2.style.top = (player2.y - player2.size/2) + 'px';
    ballEl.style.left = (ball.x - ball.size/2) + 'px';
    ballEl.style.top = (ball.y - ball.size/2) + 'px';
  }
</script>
</body>
</html>
